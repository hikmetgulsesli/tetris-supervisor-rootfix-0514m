<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Tetris Supervisor - Paused</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&amp;family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#273649",
                        "on-primary-container": "#798098",
                        "tertiary-fixed-dim": "#dec29a",
                        "error": "#ffb4ab",
                        "on-primary": "#283044",
                        "on-surface": "#d5e3fd",
                        "surface-container-lowest": "#010f21",
                        "on-tertiary-fixed": "#271901",
                        "inverse-primary": "#565e74",
                        "primary": "#bec6e0",
                        "surface-dim": "#051426",
                        "on-primary-fixed-variant": "#3f465c",
                        "surface-variant": "#273649",
                        "primary-fixed-dim": "#bec6e0",
                        "on-tertiary": "#3e2d11",
                        "on-secondary-fixed-variant": "#004e5a",
                        "on-secondary-fixed": "#001f25",
                        "on-surface-variant": "#c6c6cd",
                        "secondary-container": "#00cbe6",
                        "tertiary-container": "#231500",
                        "surface": "#051426",
                        "on-tertiary-container": "#957d5a",
                        "on-background": "#d5e3fd",
                        "on-tertiary-fixed-variant": "#574425",
                        "outline-variant": "#45464d",
                        "outline": "#909097",
                        "inverse-on-surface": "#233144",
                        "on-error-container": "#ffdad6",
                        "tertiary-fixed": "#fcdeb5",
                        "surface-container-high": "#1c2b3e",
                        "surface-bright": "#2c3a4e",
                        "secondary-fixed": "#a2eeff",
                        "error-container": "#93000a",
                        "on-secondary-container": "#00515d",
                        "background": "#051426",
                        "secondary": "#5de6ff",
                        "surface-tint": "#bec6e0",
                        "secondary-fixed-dim": "#2fd9f4",
                        "primary-container": "#0f172a",
                        "surface-container-low": "#0d1c2f",
                        "primary-fixed": "#dae2fd",
                        "on-error": "#690005",
                        "on-primary-fixed": "#131b2e",
                        "surface-container": "#122033",
                        "on-secondary": "#00363e",
                        "inverse-surface": "#d5e3fd",
                        "tertiary": "#dec29a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "base": "4px",
                        "touch_target": "44px",
                        "panel_gap": "16px",
                        "container_padding": "24px",
                        "grid_gutter": "2px"
                    },
                    "fontFamily": {
                        "label-data": ["JetBrains Mono"],
                        "headline-md": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "body-sm": ["Hanken Grotesk"],
                        "body-lg": ["Hanken Grotesk"],
                        "label-caps": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "label-data": ["16px", { "lineHeight": "1.4", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .wireframe-grid {
            background-size: 20px 20px;
            background-image:
                linear-gradient(to right, #334155 1px, transparent 1px),
                linear-gradient(to bottom, #334155 1px, transparent 1px);
        }
    </style>
</head>
<body class="bg-background text-on-background h-screen w-screen overflow-hidden flex flex-col font-body-lg">
<!-- Background Simulated Game Board (Dimmed) -->
<div class="absolute inset-0 z-0 opacity-20 wireframe-grid flex justify-center items-center">
<!-- Mock Tetrominoes in background -->
<div class="absolute bottom-20 left-1/3 w-10 h-10 bg-secondary border border-surface-container-highest"></div>
<div class="absolute bottom-20 left-[calc(33.333%+40px)] w-10 h-10 bg-secondary border border-surface-container-highest"></div>
<div class="absolute bottom-[calc(5rem+40px)] left-1/3 w-10 h-10 bg-secondary border border-surface-container-highest"></div>
<div class="absolute bottom-[calc(5rem+40px)] left-[calc(33.333%+40px)] w-10 h-10 bg-secondary border border-surface-container-highest"></div>
</div>
<!-- Pause Overlay Canvas -->
<div class="relative z-10 flex-1 flex flex-col justify-center items-center p-container_padding bg-surface-dim/80 backdrop-blur-sm">
<!-- Central Modal Card -->
<div class="bg-surface border border-outline-variant w-full max-w-md shadow-[0_0_20px_rgba(34,211,238,0.05)]">
<!-- Modal Header -->
<div class="border-b border-outline-variant p-container_padding bg-surface-container-low flex items-center justify-between">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">pause_circle</span>
<h2 class="font-headline-md text-headline-md text-primary tracking-widest uppercase">SESSION PAUSED</h2>
</div>
<div class="w-2 h-2 bg-secondary rounded-full animate-pulse shadow-[0_0_8px_#5de6ff]"></div>
</div>
<!-- Modal Content - Stats -->
<div class="p-container_padding flex flex-col gap-panel_gap">
<div class="grid grid-cols-2 gap-4">
<!-- Score Panel -->
<div class="bg-surface-container-lowest border border-outline-variant p-3 flex flex-col gap-1">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">Current Score</span>
<span class="font-label-data text-label-data text-secondary">042,850</span>
</div>
<!-- Level Panel -->
<div class="bg-surface-container-lowest border border-outline-variant p-3 flex flex-col gap-1">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">Target Level</span>
<span class="font-label-data text-label-data text-primary">12</span>
</div>
</div>
<div class="bg-surface-container-lowest border border-outline-variant p-3 flex flex-col gap-1 mt-2">
<div class="flex justify-between items-center mb-1">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Line Progress</span>
<span class="font-label-data text-label-data text-on-surface text-sm">45/50</span>
</div>
<div class="w-full h-[4px] bg-surface-variant">
<div class="h-full bg-secondary w-[90%] shadow-[0_0_5px_#5de6ff]"></div>
</div>
</div>
</div>
<!-- Modal Actions -->
<div class="p-container_padding pt-0 flex flex-col gap-3 mt-4">
<button class="w-full h-touch_target bg-secondary-container/10 border-2 border-secondary text-secondary font-label-caps text-label-caps flex justify-center items-center hover:bg-secondary hover:text-surface-container-lowest transition-colors duration-200 uppercase tracking-[0.15em] focus:outline-none focus:ring-2 focus:ring-secondary focus:ring-offset-4 focus:ring-offset-surface">
                    RESUME OPERATION
                </button>
<button class="w-full h-touch_target bg-surface-container border border-outline-variant text-primary font-label-caps text-label-caps flex justify-center items-center hover:bg-surface-container-high transition-colors duration-200 uppercase tracking-widest focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-4 focus:ring-offset-surface">
                    RESTART SEQUENCE
                </button>
<button class="w-full h-touch_target mt-2 text-error font-label-caps text-label-caps flex justify-center items-center hover:bg-error/10 transition-colors duration-200 uppercase tracking-widest focus:outline-none border border-transparent hover:border-error/30">
                    ABORT TO MENU
                </button>
</div>
<!-- Terminal Decor -->
<div class="border-t border-outline-variant/50 p-2 bg-surface-container-lowest flex justify-between items-center opacity-60">
<span class="font-label-data text-label-data text-[10px] text-on-surface-variant">&gt; SYS_HALT_ACTIVE</span>
<span class="font-label-data text-label-data text-[10px] text-on-surface-variant">0x00A4F</span>
</div>
</div>
</div>
</body></html>
