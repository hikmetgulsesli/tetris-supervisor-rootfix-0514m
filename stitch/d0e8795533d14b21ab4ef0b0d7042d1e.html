<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Tetris Supervisor - Main Menu</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#273649",
                        "on-primary-container": "#798098",
                        "tertiary-fixed-dim": "#dec29a",
                        "error": "#ffb4ab",
                        "on-primary": "#283044",
                        "on-surface": "#d5e3fd",
                        "surface-container-lowest": "#010f21",
                        "on-tertiary-fixed": "#271901",
                        "inverse-primary": "#565e74",
                        "primary": "#bec6e0",
                        "surface-dim": "#051426",
                        "on-primary-fixed-variant": "#3f465c",
                        "surface-variant": "#273649",
                        "primary-fixed-dim": "#bec6e0",
                        "on-tertiary": "#3e2d11",
                        "on-secondary-fixed-variant": "#004e5a",
                        "on-secondary-fixed": "#001f25",
                        "on-surface-variant": "#c6c6cd",
                        "secondary-container": "#00cbe6",
                        "tertiary-container": "#231500",
                        "surface": "#051426",
                        "on-tertiary-container": "#957d5a",
                        "on-background": "#d5e3fd",
                        "on-tertiary-fixed-variant": "#574425",
                        "outline-variant": "#45464d",
                        "outline": "#909097",
                        "inverse-on-surface": "#233144",
                        "on-error-container": "#ffdad6",
                        "tertiary-fixed": "#fcdeb5",
                        "surface-container-high": "#1c2b3e",
                        "surface-bright": "#2c3a4e",
                        "secondary-fixed": "#a2eeff",
                        "error-container": "#93000a",
                        "on-secondary-container": "#00515d",
                        "background": "#051426",
                        "secondary": "#5de6ff",
                        "surface-tint": "#bec6e0",
                        "secondary-fixed-dim": "#2fd9f4",
                        "primary-container": "#0f172a",
                        "surface-container-low": "#0d1c2f",
                        "primary-fixed": "#dae2fd",
                        "on-error": "#690005",
                        "on-primary-fixed": "#131b2e",
                        "surface-container": "#122033",
                        "on-secondary": "#00363e",
                        "inverse-surface": "#d5e3fd",
                        "tertiary": "#dec29a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "base": "4px",
                        "touch_target": "44px",
                        "panel_gap": "16px",
                        "container_padding": "24px",
                        "grid_gutter": "2px"
                    },
                    "fontFamily": {
                        "label-data": ["JetBrains Mono"],
                        "headline-md": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "body-sm": ["Hanken Grotesk"],
                        "body-lg": ["Hanken Grotesk"],
                        "label-caps": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "label-data": ["16px", { "lineHeight": "1.4", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-background font-body-lg antialiased min-h-screen flex flex-col relative overflow-hidden">
<!-- Background Matrix Overlay -->
<div class="absolute inset-0 pointer-events-none z-0 opacity-10 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-surface-variant via-background to-background">
<!-- Abstract grid representation -->
<div class="w-full h-full" style="background-image: linear-gradient(#334155 1px, transparent 1px), linear-gradient(90deg, #334155 1px, transparent 1px); background-size: 40px 40px; background-position: center;"></div>
</div>
<!-- SideNavBar (Suppressed as this is a high-level destination, but if it were visible, it would go here. Hiding based on instructions for focus screens, but keeping header elements for brand) -->
<header class="flex justify-between items-center w-full px-container_padding py-base max-w-full bg-surface dark:bg-surface border-b border-outline-variant z-10 relative">
<div class="font-headline-lg text-headline-lg font-bold tracking-tighter text-primary dark:text-primary">
            TETRIS SUPERVISOR
        </div>
<div class="flex items-center gap-panel_gap">
<button aria-label="settings" class="hover:bg-surface-container-highest dark:hover:bg-surface-container-highest transition-colors p-2 text-on-surface-variant dark:text-on-surface-variant">
<span class="material-symbols-outlined">settings</span>
</button>
<button aria-label="help_outline" class="hover:bg-surface-container-highest dark:hover:bg-surface-container-highest transition-colors p-2 text-on-surface-variant dark:text-on-surface-variant">
<span class="material-symbols-outlined">help_outline</span>
</button>
<button aria-label="leaderboard" class="hover:bg-surface-container-highest dark:hover:bg-surface-container-highest transition-colors p-2 text-on-surface-variant dark:text-on-surface-variant">
<span class="material-symbols-outlined">leaderboard</span>
</button>
</div>
</header>
<main class="flex-grow flex items-center justify-center relative z-10 p-container_padding">
<div class="flex flex-col md:flex-row gap-8 w-full max-w-6xl">
<!-- Left Info Panel -->
<div class="hidden md:flex flex-col justify-end w-1/3 pb-8">
<div class="bg-surface-container border border-outline-variant rounded p-6">
<p class="font-label-caps text-label-caps text-on-surface-variant mb-2">SYSTEM STATUS</p>
<p class="font-label-data text-label-data text-secondary">ONLINE / STABLE</p>
<div class="mt-4 h-1 w-full bg-surface-variant">
<div class="h-full bg-secondary w-full"></div>
</div>
</div>
</div>
<!-- Central Menu Canvas -->
<div class="flex flex-col items-center justify-center w-full md:w-1/3">
<div class="mb-12 text-center">
<h1 class="font-headline-lg text-headline-lg text-secondary mb-2" style="font-size: 3rem; line-height: 1.1;">SUPERVISOR_OS</h1>
<p class="font-label-data text-label-data text-on-surface-variant tracking-widest">v4.0.2-STABLE</p>
</div>
<div class="flex flex-col gap-4 w-full max-w-xs">
<!-- Menu Options -->
<button class="group relative overflow-hidden bg-primary text-on-primary font-label-caps text-label-caps h-touch_target flex items-center justify-center border-2 border-primary hover:bg-surface hover:text-primary transition-all duration-200">
<span class="relative z-10 flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">play_arrow</span>
                            START NEW SESSION
                        </span>
</button>
<button class="group relative overflow-hidden bg-surface-container-high text-secondary font-label-caps text-label-caps h-touch_target flex items-center justify-center border border-outline-variant hover:border-secondary hover:bg-surface transition-all duration-200">
<span class="relative z-10 flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">resume</span>
                            RESUME
                        </span>
</button>
<button class="group relative overflow-hidden bg-surface-container text-on-surface font-label-caps text-label-caps h-touch_target flex items-center justify-center border border-outline-variant hover:border-primary hover:bg-surface-variant transition-all duration-200 mt-4">
<span class="relative z-10 flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">gamepad</span>
                            CONTROLS
                        </span>
</button>
<button class="group relative overflow-hidden bg-surface-container text-on-surface font-label-caps text-label-caps h-touch_target flex items-center justify-center border border-outline-variant hover:border-primary hover:bg-surface-variant transition-all duration-200">
<span class="relative z-10 flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">military_tech</span>
                            LEADERBOARD
                        </span>
</button>
</div>
</div>
<!-- Right Info Panel -->
<div class="hidden md:flex flex-col justify-end w-1/3 pb-8 items-end">
<div class="bg-surface-container border border-outline-variant rounded p-6 text-right">
<p class="font-label-caps text-label-caps text-on-surface-variant mb-2">LAST SESSION</p>
<p class="font-label-data text-label-data text-on-surface">SCORE: 142,050</p>
<p class="font-label-data text-label-data text-on-surface-variant text-sm mt-1">LVL 12 - 04:22 PM</p>
</div>
</div>
</div>
</main>
<footer class="flex justify-between items-center w-full px-container_padding py-base bg-surface-dim dark:bg-surface-dim border-t border-outline-variant z-10 relative">
<div class="font-label-caps text-label-caps text-on-surface-variant dark:text-on-surface-variant">
            © 2024 SUPERVISOR_OS. TECHNICAL EXECUTION SECURED.
        </div>
<div class="flex gap-6">
<a class="font-label-caps text-label-caps text-on-tertiary-container hover:text-on-surface hover:text-primary transition-colors opacity-80 hover:opacity-100" href="#">TERMINAL_LOGS</a>
<a class="font-label-caps text-label-caps text-on-tertiary-container hover:text-on-surface hover:text-primary transition-colors opacity-80 hover:opacity-100" href="#">SYSTEM_STATUS</a>
<a class="font-label-caps text-label-caps text-on-tertiary-container hover:text-on-surface hover:text-primary transition-colors opacity-80 hover:opacity-100" href="#">LEGAL_DECRYPT</a>
</div>
</footer>
</body></html>
